name: Label PR Based on Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch PR details
        id: pr_details
        run: |
          CHANGED_LINES=$(jq '. | .additions + .deletions' <<< "${{ toJson(github.event.pull_request) }}")
          echo "Changed lines: $CHANGED_LINES"
          if [ "$CHANGED_LINES" -lt 50 ]; then
            echo "::set-output name=label::small"
          elif [ "$CHANGED_LINES" -le 200 ]; then
            echo "::set-output name=label::medium"
          else
            echo "::set-output name=label::large"
          fi

      - name: Label PR
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: ${{ steps.pr_details.outputs.label }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
